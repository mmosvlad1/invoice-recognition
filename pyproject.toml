[project]
name = "invoice-recognition"
version = "0.1.0"
description = "FastAPI service that recognises invoices with an LLM and verifies the result with deterministic checks."
readme = "README.md"
authors = [
    { name = "Vlad", email = "mmosvlad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "fastapi-cli>=0.0.34",
    "httpx>=0.29.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-core>=2.50.5",
    "pydantic-settings>=2.16.3",
    "pypdf[crypto]>=7.2.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "starlette>=1.10.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.2",
    "ruff>=0.17.6",
    "types-reportlab>=5.1.0.20261122",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.10"

[tool.pytest]
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.fastapi]
# What `uv run fastapi dev` and `uv run fastapi run` serve.
entrypoint = "invoice_recognition.api.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["FAST"]

[tool.ruff.lint.isort]
# Shared test helpers, imported as top-level modules through pytest's pythonpath.
known-local-folder = ["boxes_help", "drawn", "fakes", "golden_cases", "samples"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Checks the arguments of pydantic models and settings; without it mypy rejects
# Settings() whose required fields come from the environment.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# pypdfium2 ships no type information (no py.typed, no stubs). Following its
# untyped code gives nothing to check (every value is Any) and trips
# no-untyped-call under strict, so treat the module as Any.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
