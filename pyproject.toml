[project]
name = "invoice-recognition"
version = "0.1.0"
description = "FastAPI service that recognises invoices with an LLM and verifies the result with deterministic checks."
readme = "README.md"
authors = [
    { name = "Vlad", email = "mmosvlad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.29.0",
    "pypdf>=7.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.2",
    "ruff>=0.17.6",
    "types-reportlab>=5.1.0.20261122",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.10"

[tool.pytest]
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["FAST"]

[tool.ruff.lint.isort]
# Shared test helpers, imported as a top-level module through pytest's pythonpath.
known-local-folder = ["fakes"]

[tool.mypy]
strict = true
files = ["src", "tests"]
